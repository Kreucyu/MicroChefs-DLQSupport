<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editor JSON</title>
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.20.0/min/vs/editor/editor.main.min.css">
</head>
<body style="background-color: black;">
    <div>
        <h1 style="color: white; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;">
            Editor JSON
        </h1>
    </div>
    <div id="editorJSON" style="height: 400px; border: 1px solid black;"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.26.1/min/vs'}})
        require(["vs/editor/editor.main"], () => {
            monaco.editor.create(document.getElementById('editorJSON'), {
                value: `{
                "id": 1,
                "quantidadeProduto": 2,
                "formaDePagamento": "DINHEIRO"
                }`,
                language: 'json',
                theme: 'vs-dark',
            })
        })
    </script>

</body>
